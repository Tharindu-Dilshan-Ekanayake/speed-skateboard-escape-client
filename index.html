<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Ride to gain +1 Speed, escape the skatepark and become the fastest on the server!" />

    <link rel="preconnect" href="https://api.bloxity.io" crossorigin />
    <link rel="preconnect" href="https://play.bloxity.io" crossorigin />
    <link rel="preload" as="fetch" href="https://static.bloxity.io/avatars/player.glb" crossorigin />

    <!-- Bloxity SDK. Exposes itself as window.Legion.SDK.
         Must load before the Vite entry script below. -->
    <script src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
